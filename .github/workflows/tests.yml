name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Install nightly
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install tarpaulin
      uses: actions-rs/install@v0.1
      with:
        crate: cargo-tarpaulin
        version: 0.37.2
        use-tool-cache: true

    - name: Build
      run: cargo build

    - name: Run tests with coverage
      working-directory: ./entab
      run: cargo tarpaulin --all --timeout 600 --out Xml -- --test-threads 1

    - name: Upload to codecov
      uses: codecov/codecov-action@v2
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  misc_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Install rust-toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable

    - name: Run no_std tests
      working-directory: ./entab
      run: cargo test --no-default-features

  r-package:
    name: R package (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.r == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  r: 'release' }
          - { os: macos-latest,   r: 'release' }
          - { os: windows-latest, r: 'release' }
          # Windows is the only platform where the R version matters much: it
          # links against an import library regenerated from R.dll's exports
          # each release, so a symbol R stops exporting breaks linking there
          # first. Unix links a shared libR that still resolves them. oldrel
          # guards the extendr bump, devel is early warning for the next one.
          - { os: windows-latest, r: 'oldrel' }
          - { os: windows-latest, r: 'devel' }
    steps:
    - uses: actions/checkout@v4

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r }}

    - uses: dtolnay/rust-toolchain@stable

    - name: Add the GNU target Makevars.win builds for
      if: runner.os == 'Windows'
      run: rustup target add x86_64-pc-windows-gnu

    # The failure this guards against is a link error, so INSTALL is the test.
    # shell: bash matters on Windows -- the runner defaults to pwsh, where R is
    # a built-in alias for Invoke-History and never reaches the real R.
    - name: Install entab-r
      shell: bash
      run: R CMD INSTALL entab-r

    - name: Load and parse
      shell: Rscript {0}
      run: |
        library(entab)
        r <- Reader("entab/tests/data/b3_alkanes.dxf")
        d <- as.data.frame(r)
        stopifnot(r$parser() == "thermo_dxf", nrow(d) > 0, ncol(d) == 3)
        cat("ok:", nrow(d), "rows\n")
